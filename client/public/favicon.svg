<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="pulseGrad" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="linkGrad" x1="8" y1="8" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="32" height="32" rx="8" fill="#0f172a"/>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7.25" stroke="url(#pulseGrad)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Link & Pulse Symbol -->
  <g filter="url(#glow)">
    <!-- Connected link ring (left) -->
    <path d="M12 10H9a4 4 0 0 0-4 4v0a4 4 0 0 0 4 4h3" stroke="url(#linkGrad)" stroke-width="2.2" stroke-linecap="round"/>
    
    <!-- Connected link ring (right) -->
    <path d="M20 22h3a4 4 0 0 0 4-4v0a4 4 0 0 0-4-4h-3" stroke="url(#linkGrad)" stroke-width="2.2" stroke-linecap="round"/>
    
    <!-- Center pulse heartbeat / beam -->
    <path d="M11 16h2.5l1.5-3.5 2 7 1.5-3.5h2.5" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>